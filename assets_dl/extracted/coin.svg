<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-64 -64 128 128">
<defs>
  <radialGradient id="coin" cx="40%" cy="32%" r="58%"><stop offset="0%" stop-color="#fffde0"/><stop offset="50%" stop-color="#ffd700"/><stop offset="100%" stop-color="#b87800"/></radialGradient>
  <radialGradient id="hl_c" cx="35%" cy="28%" r="42%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <filter id="cog"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<!-- 外光晕 -->
<circle cx="0" cy="0" r="50" fill="#ffd700" opacity="0.2" filter="url(#cog)"/>
<!-- 外圈 -->
<circle cx="0" cy="0" r="46" fill="#b87800"/>
<!-- 主体 -->
