<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="-96 -96 192 192">
<defs>
  <radialGradient id="seat" cx="45%" cy="35%" r="55%"><stop offset="0%" stop-color="#2e4a60"/><stop offset="100%" stop-color="#0d1e2c"/></radialGradient>
  <radialGradient id="hl_seat" cx="40%" cy="30%" r="42%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <filter id="cg"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- 发光圆底 -->
<circle cx="0" cy="0" r="30" fill="#a080ff" opacity="0.25" filter="url(#cg)"/>
<!-- 炮台座 -->
<circle cx="0" cy="0" r="30" fill="url(#seat)" stroke="#7c5cff" stroke-width="3"/>
<circle cx="0" cy="0" r="30" fill="url(#hl_seat)"/>
<!-- 炮管（竖直，尖端朝上） -->
<rect x="-8" y="-60" width="16" height="48" rx="4" fill="#7c5cff"/>
<rect x="-6" y="-62" width="12" height="14" rx="3" fill="#a080ff" opacity="0.9"/>
<!-- 发光圆环 -->
<circle cx="0" cy="0" r="30" fill="none" stroke="#a080ff" stroke-width="2.5" opacity="0.7"/>
<!-- 倍率文字 -->
<text x="0" y="6" text-anchor="middle" dominant-baseline="middle" fill="#7c5cff" font-size="18" font-weight="bold" font-family="Courier New, monospace">2×</text>
</svg>