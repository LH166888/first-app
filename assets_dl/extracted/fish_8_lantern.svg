<path d="M-60,-15 Q-20,-20 60,-15" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.55"/>
<path d="M-60,8 Q-20,14 60,8" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>
