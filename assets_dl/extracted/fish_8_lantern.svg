<circle cx="10" cy="10" r="4" fill="#00e5ff" opacity="0.4"/>
<circle cx="-55" cy="8" r="3.5" fill="#00e5ff" opacity="0.35"/>
<!-- 高光 -->
<ellipse cx="-5" cy="-12" rx="35" ry="18" fill="url(#hl8)"/>
<!-- 眼（大，发光） -->
<circle cx="68" cy="-12" r="14" fill="#00d4ff" stroke="#004888" stroke-width="1.5"/>
<circle cx="70" cy="-11" r="9" fill="#001830"/>
<circle cx="67" cy="-14" r="4" fill="#00e5ff" opacity="0.8"/>
<circle cx="65" cy="-15" r="2" fill="#ffffff"/>
