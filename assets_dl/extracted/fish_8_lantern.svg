<svg xmlns="http://www.w3.org/2000/svg" width="384" height="256" viewBox="-192 -128 384 256">
<defs>
  <radialGradient id="b8" cx="40%" cy="40%" r="55%"><stop offset="0%" stop-color="#82d8ff"/><stop offset="60%" stop-color="#0090d0"/><stop offset="100%" stop-color="#004880"/></radialGradient>
  <radialGradient id="lamp8" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="40%" stop-color="#00e5ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#0070c0" stop-opacity="0"/></radialGradient>
  <radialGradient id="hl8" cx="35%" cy="28%" r="38%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <filter id="glow8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
