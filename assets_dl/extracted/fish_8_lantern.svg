<circle cx="110" cy="-90" r="10" fill="url(#lamp8)"/>
<circle cx="110" cy="-90" r="5" fill="#ffffff" opacity="0.9"/>
<!-- 尾鳍 -->
<path d="M-88,0 Q-140,-44 -144,-12 Q-140,0 -144,12 Q-140,44 -88,0" fill="#006aaa" opacity="0.9"/>
