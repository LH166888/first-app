<ellipse cx="0" cy="-20" rx="40" ry="18" fill="#c06000" opacity="0.25"/>
<ellipse cx="-20" cy="-18" rx="14" ry="10" fill="#994400" opacity="0.2"/>
<!-- 高光 -->
<ellipse cx="-5" cy="-14" rx="26" ry="16" fill="url(#hl3)"/>
<!-- 眼（大而突出） -->
<circle cx="46" cy="-12" r="14" fill="#ffffff" stroke="#884400" stroke-width="1.5"/>
<circle cx="48" cy="-11" r="9" fill="#1a0800"/>
<circle cx="45" cy="-14" r="4" fill="#ffffff"/>
<!-- 嘴（小圆嘴） -->
